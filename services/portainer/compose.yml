name: portainer

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ee:latest
    restart: always
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    ports:
      - 9443:9443
    environment:
      TRUSTED_ORIGINS: portainer.${INTERNAL_DOMAIN:?error}
    networks:
      - proxy-internal
    labels:
      diun.enable: true
      diun.watch_repo: false
      diun.include_tags: ^latest$
      caddy: "{$$WILDCARD_INTERNAL}"
      caddy.import: service_proxy portainer
      caddy.import.reverse_proxy: "{{ upstreams 9443 }}"
      caddy.import.reverse_proxy.import: https
      homepage.instance.admin.group: Infrastructure
      homepage.instance.admin.name: Portainer
      homepage.instance.admin.icon: portainer-dark
      homepage.instance.admin.href: https://portainer.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.description: Container management
      homepage.instance.admin.weight: 300
      homepage.instance.admin.widget.type: portainer
      homepage.instance.admin.widget.url: https://portainer.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.widget.env: "{{HOMEPAGE_VAR_PORTAINER_ENVIRONMENT_ID}}"
      homepage.instance.admin.widget.key: "{{HOMEPAGE_FILE_PORTAINER_API_KEY}}"

volumes:
  data:
    name: portainer_data
    external: true

networks:
  proxy-internal:
    external: true
