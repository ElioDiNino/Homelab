services:
  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2
    restart: always
    volumes:
      - data:/app/data
    networks:
      - proxy-internal
    labels:
      diun.enable: true
      caddy: "{$$WILDCARD_INTERNAL}"
      caddy.import: service_proxy status
      caddy.import.import: tinyauth
      caddy.import.reverse_proxy: "{{ upstreams 3001 }}"
      tinyauth.apps.uptime-kuma.config.domain: status.${INTERNAL_DOMAIN:?error}
      tinyauth.apps.uptime-kuma.oauth.groups: admins
      tinyauth.apps.uptime-kuma.path.allow: ^\/(status(\/|$)|icon\.svg$|(assets|upload|api\/(push|badge|status-page))\/)
      homepage.instance.admin.group: Monitoring
      homepage.instance.admin.name: Uptime Kuma
      homepage.instance.admin.icon: uptime-kuma
      homepage.instance.admin.href: https://status.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.description: Service uptime monitor
      homepage.instance.admin.weight: 2
      homepage.instance.admin.widget.type: uptimekuma
      homepage.instance.admin.widget.url: https://status.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.widget.slug: all

volumes:
  data:

networks:
  proxy-internal:
    external: true
