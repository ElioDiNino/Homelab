x-restart-policy: &restart_policy
  restart: always
x-read_only: &read_only
  read_only: true
x-cap_drop: &cap_drop
  cap_drop:
    - ALL
x-security_opt: &security_opt
  security_opt:
    - no-new-privileges
x-healthcheck-defaults: &healthcheck_defaults
  start_period: 10s
  timeout: 5s
x-environment-ipp: &environment-ipp
  environment:
    PUBLIC_BASE_URL: https://${IMMICH_EXTERNAL_SUBDOMAIN:?error}.${EXTERNAL_DOMAIN:?error}
    IMMICH_URL: http://immich-server:2283
    CONFIG: |
      {
        "ipp": {
          "allowDownload": 1,
          "maxDownloadQuality": "original",
          "downloadedFilename": 2,
          "maxZoomQuality": "fullsize",
          "motionPhotos": true,
          "showHomePage": true,
          "allowSlugLinks": false,
          "uploadUrl": "/upload",
          "shareCacheTime": 120,
          "showMetadata": {
            "description": {
              "caption": true,
              "sidebar": true
            },
            "exif": {
              "dateTimeOriginal": true,
              "timeZone": true,
              "fileName": false,
              "dimensions": true,
              "fileSize": true,
              "make": true,
              "model": true,
              "lensModel": true,
              "exposureTime": true,
              "iso": true,
              "fNumber": true,
              "focalLength": true
            },
            "location": {
              "city": true,
              "state": true,
              "country": true,
              "gps": true,
              "webLink": true
            }
          },
          "gallery": {
            "showTitle": true,
            "showDescription": true,
            "showExpiryDate": true,
            "expiryDateFormat": "MMM D, YYYY [at] h:mm A",
            "expiryDateLocale": "en-ca",
            "showDownloadZip": true,
            "groupByDate": "day",
            "singleImage": true,
            "singleVideo": true,
            "singleItemAutoOpen": true,
            "cacheTime": 300
          },
          "lightbox": {
            "showArrows": true,
            "mobileArrows": false,
            "showDownload": true,
            "autoPlayVideos": false,
            "options": {}
          },
          "upload": {
            "maxFileSize": 100,
            "rateLimit": 60,
            "byteBudget": 10240,
            "filenamePrefix": "ipp_upload_",
            "notice": "Uploaded photos may not appear in the gallery immediately.",
            "askName": true,
            "fieldSeparator": ",",
            "notifyUrl": "https://gotify.${INTERNAL_DOMAIN:?error}/message?token=${IMMICH_PUBLIC_PROXY_GOTIFY_TOKEN:?error}",
            "notifyHeaders": {},
            "notifyTimeout": 10000
          },
          "customInvalidResponse": false,
          "responseHeaders": {
            "Cache-Control": "public, max-age=2592000",
            "Access-Control-Allow-Origin":  "*"
          }
        }
      }
x-ipp-base: &ipp-base
  <<: [*restart_policy, *read_only, *cap_drop, *security_opt, *environment-ipp]
  depends_on:
    immich-server:
      condition: service_healthy
  networks:
    - frontend
    - proxy-immich-public
  labels:
    diun.enable: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    <<: *restart_policy
    depends_on:
      - redis
      - database
    # extends:
    #   file: hwaccel.transcoding.yaml
    #   service: quicksync
    volumes:
      - uploads:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      disable: false
    secrets:
      - db_name
      - db_username
      - db_password
    environment:
      TZ: ${TIMEZONE:?error}
      DB_DATABASE_NAME_FILE: /run/secrets/db_name
      DB_USERNAME_FILE: /run/secrets/db_username
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD: ${IMMICH_CACHE_PASSWORD:?error}
      IMMICH_TRUSTED_PROXIES: 172.16.0.0/12
      IMMICH_HELMET_FILE: true
    networks:
      - frontend
      - backend
      - proxy-internal
      - proxy-immich-upload-public
    labels:
      diun.enable: true
      caddy: "{$$WILDCARD_INTERNAL}"
      caddy.import: service_proxy photos
      caddy.import.reverse_proxy: "{{ upstreams 2283 }}"
      homepage.group: Media
      homepage.name: Immich
      homepage.icon: immich
      homepage.href: https://photos.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.description: Personal photos and videos
      homepage.weight: 1
      homepage.widget.type: immich
      homepage.widget.version: 2
      homepage.widget.url: https://photos.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.widget.key: "{{HOMEPAGE_FILE_IMMICH_API_KEY}}"
      homepage.widget.fields: '["photos", "videos", "storage"]'
      homepage.widget.hideErrors: true

  immich-public-proxy:
    image: ghcr.io/alangrainger/immich-public-proxy:4
    <<: *ipp-base
    healthcheck:
      <<: *healthcheck_defaults
      test: curl -sf -m 4 http://localhost:3000/share/healthcheck -o /dev/null || exit 1

  immich-public-proxy-upload:
    image: ghcr.io/alangrainger/immich-public-proxy-upload:4
    <<: *ipp-base
    healthcheck:
      <<: *healthcheck_defaults
      test: curl -sf -m 4 http://localhost:3000/healthcheck -o /dev/null || exit 1

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3
    <<: *restart_policy
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    networks:
      - outgoing
      - backend
    labels:
      diun.enable: true
    deploy:
      resources:
        limits:
          memory: ${IMMICH_ML_MEMORY_LIMIT:?error}

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    <<: *restart_policy
    healthcheck:
      test: valkey-cli -a '${IMMICH_CACHE_PASSWORD:?error}' ping | grep -q PONG || exit 1
    environment:
      VALKEY_EXTRA_FLAGS: "--requirepass ${IMMICH_CACHE_PASSWORD:?error}"
    networks:
      - backend

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    <<: *restart_policy
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 128mb
    secrets:
      - db_name
      - db_username
      - db_password
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: SSD
    networks:
      - backend

secrets:
  db_name:
    environment: IMMICH_DB_DATABASE_NAME
  db_username:
    environment: IMMICH_DB_USERNAME
  db_password:
    environment: IMMICH_DB_PASSWORD

volumes:
  model-cache:
  db-data:
  uploads:
    driver: local
    driver_opts:
      type: cifs
      device: //${HEXOS_HOST:?error}/${IMMICH_HEXOS_FOLDER:-Immich}
      o: username=${IMMICH_HEXOS_USERNAME:?error},password=${IMMICH_HEXOS_PASSWORD:?error},vers=3

networks:
  frontend:
  outgoing:
  backend:
    internal: true
  proxy-internal:
    external: true
  proxy-immich-public:
    external: true
  proxy-immich-upload-public:
    external: true
