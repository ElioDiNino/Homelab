services:
  beszel:
    image: ghcr.io/henrygd/beszel/beszel:0
    restart: always
    volumes:
      - data:/beszel_data
      - beszel-socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      start_period: 5s
      interval: 120s
    environment:
      APP_URL: "https://beszel.${INTERNAL_DOMAIN:?error}"
      CHECK_UPDATES: true
      DISABLE_PASSWORD_AUTH: true
      OAUTH_DISABLE_POPUP: true
      SHARE_ALL_SYSTEMS: true
      USER_CREATION: true
    networks:
      - proxy-internal
    labels:
      diun.enable: true
      caddy: "{$$WILDCARD_INTERNAL}"
      caddy.import: service_proxy beszel
      caddy.import.request_body.max_size: 10MB
      caddy.import.reverse_proxy: "{{ upstreams 8090 }}"
      caddy.import.reverse_proxy.transport: http
      caddy.import.reverse_proxy.transport.read_timeout: 360s
      homepage.instance.admin.group: Monitoring
      homepage.instance.admin.name: Beszel
      homepage.instance.admin.icon: beszel
      homepage.instance.admin.href: https://beszel.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.description: System resource monitor
      homepage.instance.admin.weight: 1
      homepage.instance.admin.widget.type: beszel
      homepage.instance.admin.widget.version: 2
      homepage.instance.admin.widget.url: https://beszel.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
      homepage.instance.admin.widget.username: "{{HOMEPAGE_FILE_BESZEL_USERNAME}}"
      homepage.instance.admin.widget.password: "{{HOMEPAGE_FILE_BESZEL_PASSWORD}}"

  beszel-local-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:0
    restart: always
    depends_on:
      beszel:
        condition: service_healthy
    volumes:
      - data-agent:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      start_period: 5s
      interval: 120s
    secrets:
      - agent_key
      - agent_token
    environment:
      LISTEN: /beszel_socket/beszel.sock
      DOCKER_HOST: tcp://socket-proxy:2375
      HUB_URL: "https://beszel.${INTERNAL_DOMAIN:?error}"
      KEY_FILE: /run/secrets/agent_key
      TOKEN_FILE: /run/secrets/agent_token
      LOG_LEVEL: ${BESZEL_LOG_LEVEL:-info}
    networks:
      - outgoing
      - socket-proxy-beszel-agent
    labels:
      diun.enable: true
      socket-proxy.allow.get: (/v1\.\d{1,2})?/(version|info|containers/(json|[\w.-]+/(json|stats))(\?\S+)?)

secrets:
  agent_key:
    environment: BESZEL_LOCAL_AGENT_KEY
  agent_token:
    environment: BESZEL_LOCAL_AGENT_TOKEN

volumes:
  data:
  data-agent:
  beszel-socket:

networks:
  outgoing:
  proxy-internal:
    external: true
  socket-proxy-beszel-agent:
    external: true
